name: Build Remote Ops Agent

on:
  push:
    branches: [main]
    paths:
      - 'agent/src/**'
      - 'agent/package.json'
      - 'agent/package-lock.json'
      - 'agent/install.ps1'
      - 'agent/start-agent.vbs'
      - '.github/workflows/build-agent.yml'

  pull_request:
    branches: [main]
    paths:
      - 'agent/src/**'
      - 'agent/package.json'
      - 'agent/package-lock.json'
      - 'agent/install.ps1'
      - 'agent/start-agent.vbs'
      - '.github/workflows/build-agent.yml'

permissions:
  contents: read

jobs:
  build-agent:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install agent dependencies
        working-directory: agent
        run: npm ci

      - name: Build Windows executable
        working-directory: agent
        run: npm run build:win

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-ops-agent-windows
          path: agent/dist/remote-ops-agent.exe
          if-no-files-found: error
