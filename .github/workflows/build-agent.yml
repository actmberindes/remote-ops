name: Build Remote Ops Agent

on:
  push:
    branches: [main]
    paths:
      - 'agent/src/**'
      - 'agent/package.json'
      - 'agent/package-lock.json'
      - 'agent/install.ps1'
      - 'agent/start-agent.vbs'
      - '.github/workflows/build-agent.yml'

  pull_request:
    branches: [main]
    paths:
      - 'agent/src/**'
      - 'agent/package.json'
      - 'agent/package-lock.json'
      - 'agent/install.ps1'
      - 'agent/start-agent.vbs'
      - '.github/workflows/build-agent.yml'

permissions:
  contents: write

jobs:
  build-agent:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install agent dependencies
        working-directory: agent
        run: npm ci

      - name: Build Windows executable
        working-directory: agent
        run: npm run build:win

      - name: Publish executable into repository
        shell: pwsh
        run: |
          $source = "agent/dist/remote-ops-agent.exe"
          $target = "agent/remote-ops-agent.exe"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Built executable not found: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Force

      - name: Commit rebuilt executable
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force agent/remote-ops-agent.exe
          if (git diff --cached --quiet) {
            Write-Host "Executable is already up to date; nothing to commit."
            exit 0
          }
          git commit -m "build: update remote-ops-agent.exe"
          git push origin HEAD:main

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-ops-agent-windows
          path: agent/dist/remote-ops-agent.exe
          if-no-files-found: error
