name: Build Remote Ops Agent (Windows)

on:
  push:
    branches: [ main ]
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent-windows.yml'

permissions:
  contents: write

jobs:
  build-agent:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows agent
        run: npm run build:win

      - name: Replace checked-in executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist/remote-ops-agent.exe')) {
            throw 'Build did not produce dist/remote-ops-agent.exe'
          }
          Copy-Item -LiteralPath 'dist/remote-ops-agent.exe' -Destination 'remote-ops-agent.exe' -Force

      - name: Commit rebuilt executable
        shell: pwsh
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/remote-ops-agent.exe
          if (git diff --cached --quiet) {
            Write-Host 'Executable is already up to date.'
            exit 0
          }
          git commit -m 'Build updated Windows agent executable'
          git push
